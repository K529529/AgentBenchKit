<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="664" viewBox="0 0 1120 664" role="img" aria-labelledby="title desc">
<title id="title">AgentBenchKit evaluation architecture</title><desc id="desc">Benchmark, Harness, ModelSpec and Environment configure the runtime. Public trajectories become evidence; frozen candidates go to a fresh protected verifier. Metrics and failure analysis feed replay, compare, optional quality judging and the read-only Viewer. Judge never changes correctness.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#69918e" stroke-width="1.5"/></marker></defs>

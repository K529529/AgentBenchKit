<text x="588" y="181" fill="#617889" font-size="13" font-weight="400">Harness 转换为 Agent 原生配置</text>
<rect x="838" y="96" width="248" height="113" rx="12" fill="#ffffff" stroke="#d7e3e9"/>
<rect x="854" y="115" width="4" height="20" rx="2" fill="#127c70"/>
<text x="868" y="131" fill="#203648" font-size="18" font-weight="650">Environment</text>
<text x="856" y="159" fill="#617889" font-size="13" font-weight="400">HostProcess / Docker</text>
<text x="856" y="181" fill="#617889" font-size="13" font-weight="400">执行工作区 / 进程生命周期</text>

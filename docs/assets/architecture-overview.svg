<text x="320" y="159" fill="#617889" font-size="13" font-weight="400">Nexus / Codex</text>
<text x="320" y="181" fill="#617889" font-size="13" font-weight="400">公共 CLI 接入 · 不修改 Agent</text>
<rect x="570" y="96" width="248" height="113" rx="12" fill="#ffffff" stroke="#d7e3e9"/>
<rect x="586" y="115" width="4" height="20" rx="2" fill="#127c70"/>

<text x="780" y="384" fill="#203648" font-size="18" font-weight="650">Fresh Verifier</text>
<text x="768" y="412" fill="#617889" font-size="13" font-weight="400">全新环境 + 受保护验证资产</text>
<text x="768" y="434" fill="#617889" font-size="13" font-weight="400">确定性判定 · correctness authority</text>

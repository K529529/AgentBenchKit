<g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif">
<text x="34" y="35" fill="#127c70" font-size="11" font-weight="700" letter-spacing="2">ARCHITECTURE / V0</text>
<text x="34" y="69" fill="#203648" font-size="25" font-weight="700">一次评测，一条可追溯的证据链</text>
<text x="1086" y="67" fill="#627889" font-size="12" text-anchor="end">独立接入 · 独立验证 · 分层分析</text>

<rect x="34" y="96" width="248" height="113" rx="12" fill="#ffffff" stroke="#d7e3e9"/>

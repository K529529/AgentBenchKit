[project]
name = "agentbenchkit"
version = "0.1.0"
description = "Local, evidence-based evaluation of coding agents"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
    "rich>=13,<15",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
qoder = ["qodercn-agent-sdk==1.0.15"]

[project.scripts]
agent-bench = "agentbenchkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11",
    "mypy>=1.15",
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples"]
exclude = ["src/agentbenchkit/benchmarks/micro_swe/assets/"]
